[package]
name = "amber-core"
description = "Amber for Windows: everything that can go wrong without a platform API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# The phone API: a small blocking HTTP server, and the OS random source for its key.
tiny_http = "0.12"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

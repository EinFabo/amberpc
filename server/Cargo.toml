[package]
name = "amber-server"
version.workspace = true
edition.workspace = true
description = "Amber Server: Amber's phone API without the desktop app, for Linux and Windows"
license-file = "../LICENSE"

[[bin]]
name = "amber-server"
path = "src/main.rs"

[dependencies]
amber-core = { path = "../crates/core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
whisper-rs = "0.16"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[features]
# The GPU build: whisper.cpp through Vulkan (any vendor), and the Vulkan llama-server.
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
tempfile = "3"

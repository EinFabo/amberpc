# Builds the installer and publishes it as a GitHub release, with the `latest.json` the
# installed apps ask for updates.
#
# Triggered by a tag like `v0.2.0`, which has to match `version` in package.json (and in
# Cargo.toml) - that is what the app compares to decide whether an update is newer.
#
# One-time setup (repository -> Settings -> Secrets -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.amberpc/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.amberpc/updater.password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but package.json says $version" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # The release build with LTO is the long part.
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test --workspace --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Amber ${{ github.ref_name }}
          releaseBody: |
            Installer below under *Assets* (`Amber_…_x64-setup.exe`). Installed copies update themselves.
          # A draft would be invisible to the updater.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
